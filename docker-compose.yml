services:
  hindsight:
    # Local Hindsight for offline development. Uses Groq as the LLM provider.
    # Point HINDSIGHT_URL=http://localhost:8888 to use it instead of Cloud.
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: groq
      HINDSIGHT_API_LLM_GROQ_API_KEY: ${GROQ_API_KEY}
      HINDSIGHT_API_LLM_MODEL: openai/gpt-oss-120b
    volumes:
      - hindsight_data:/var/lib/hindsight
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HINDSIGHT_URL: ${HINDSIGHT_URL:-https://api.hindsight.vectorize.io}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK: ${HINDSIGHT_BANK:-underdog-lanternfish}
      HINDSIGHT_SEED_BANK: ${HINDSIGHT_SEED_BANK:-underdog-seed-w8}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SIM_SEED: ${SIM_SEED:-42}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    profiles: ["with-backend"]

volumes:
  hindsight_data: {}
