[project]
name = "underdog"
version = "0.1.0"
description = "Prospecting agent for Amazon growth agencies that learns from outreach outcomes with Hindsight."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Uday", email = "uday@brdge.ai" }]

dependencies = [
    "hindsight-client==0.10.1",
    "groq>=0.9,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.29,<0.40",
    "sqlmodel>=0.0.16,<0.1",
    "polars>=1.0,<2",
    "pyarrow>=15,<21",
    "datasets>=2.20,<5",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "faker>=25,<40",
    "pyyaml>=6,<7",
    "sse-starlette>=2.1,<3",
    "structlog>=24.1,<25",
    "orjson>=3.10,<4",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<0.15",
    "mypy>=1.10,<2",
    "matplotlib>=3.8,<4",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "frontend", "website"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # long lines
    "E741",   # ambiguous variable name (l, i, etc.)
    "SIM108", # prefer ternary
    "SIM113", # enumerate() suggestion
    "RUF046", # unnecessary int() cast
    "N802",   # function name should be lowercase (fixture helpers etc.)
    "N803",
    "N806",
    "B008",   # function calls in default args (used by FastAPI Depends)
    "SIM117", # combined with statements
    "SIM102", # collapsible if
    "UP007",  # Optional -> X | None (kept for readability)
    "B023",   # loop-variable in closure
    "SIM105", # use contextlib.suppress
    "RUF001", # ambiguous unicode in strings (× and – used intentionally)
    "RUF005", # iterable unpacking preference
    "E702",   # multiple statements on one line (used sparingly in scripts)
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["backend/tests"]
markers = [
    "integration: hits a real Hindsight or Groq endpoint (slow, needs creds)",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app"]
plugins = ["pydantic.mypy"]
